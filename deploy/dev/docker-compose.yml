version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: edms-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: edms
      POSTGRES_USER: edms
      POSTGRES_PASSWORD: edms1234
    volumes:
      - edms-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edms -d edms"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  edms-pgdata:
