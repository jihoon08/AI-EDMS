server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: ai-edms
  profiles:
    active: local

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: edms
        jdbc:
          time_zone: UTC
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: edms
    default-schema: edms
    baseline-on-migrate: true
    placeholder-replacement: false

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

logging:
  level:
    root: INFO
    com.edms: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId}] %-5level %logger{36} - %msg%n"

# OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# Application
app:
  cors:
    allowed-origins: http://localhost:3000
  datasource:
    routing:
      enabled: false
  storage:
    type: local
    local:
      base-path: ./storage
    s3:
      bucket: ai-edms-files
      region: ap-northeast-2
