spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        default_schema: PUBLIC

  flyway:
    enabled: false

app:
  datasource:
    routing:
      enabled: false
  storage:
    type: local
    local:
      base-path: ./test-storage
